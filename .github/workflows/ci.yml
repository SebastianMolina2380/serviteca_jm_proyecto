name: CI

# Compila, ejecuta pruebas unitarias y de integración contra PostgreSQL,
# valida el contrato de Docker Compose y construye la imagen.
on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar, probar y empaquetar
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: serviteca_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d serviteca_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      SERVITECA_TEST_DB_URL: jdbc:postgresql://localhost:5432/serviteca_test
      SERVITECA_TEST_DB_USER: postgres
      SERVITECA_TEST_DB_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: serviteca-jm_v5.0/pom.xml

      - name: Compilar y ejecutar pruebas (unitarias + integración)
        working-directory: serviteca-jm_v5.0
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp clean verify

      - name: Publicar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: serviteca-jm_v5.0/target/surefire-reports/
          if-no-files-found: ignore

      - name: Validar docker-compose
        run: docker compose --env-file .env.example config > /dev/null

      - name: Construir imagen Docker
        run: docker build -t serviteca-jm:ci ./serviteca-jm_v5.0
