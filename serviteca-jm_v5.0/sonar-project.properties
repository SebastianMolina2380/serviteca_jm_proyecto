# ============================================================
# SONARQUBE · CAJA BLANCA Y CALIDAD DE CÓDIGO
# ============================================================
# Se ejecuta desde la carpeta serviteca-jm_v5.0:
#   mvnw.cmd clean verify
#   mvnw.cmd sonar:sonar -Dsonar.token=TU_TOKEN
#
# El servidor se levanta con docker-compose.sonarqube.yml.
# ============================================================

sonar.projectKey=serviteca-jm
sonar.projectName=Serviteca JM
sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8
sonar.java.source=17
sonar.java.target=17

# Código de producción: Java + HTML/CSS/JS estático.
sonar.sources=src/main/java,src/main/resources/static
# Pruebas (incluye unitarias, integración MockMvc y E2E Selenium).
sonar.tests=src/test/java

# Clases compiladas que necesita el analizador de Java.
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Cobertura generada por JaCoCo durante `mvn verify`.
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Ruido: artefactos, librerías minificadas y dependencias.
sonar.exclusions=**/target/**,**/node_modules/**,**/*.min.js,**/*.min.css

# Las pruebas E2E no aportan cobertura de clases: se excluyen del análisis.
sonar.test.exclusions=**/e2e/**

# Entidades/DTOs/configuración: getters, setters y wiring sin lógica.
sonar.coverage.exclusions=**/modelos/**,**/DTOs/**,**/config/**,**/*Application.java

# Umbral de referencia (el Quality Gate real se configura en SonarQube).
sonar.qualitygate.wait=false
