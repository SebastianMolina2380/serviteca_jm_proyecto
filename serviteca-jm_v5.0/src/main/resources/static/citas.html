<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serviteca JM — Listado de Citas</title>
  <link
          href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Exo+2:wght@300;400;500;600;700&display=swap"
          rel="stylesheet"
  />
  <link rel="stylesheet" href="citas.css">
  <script src="role-guard.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="serviteca-theme.css">
</head>
<body>
<div class="layout">
  <!-- SIDEBAR LATERAL -->
  <aside class="sb">
    <div class="sb-head">
      <img
              class="sb-logo"
              src="jm-logo.png"
              alt="JM"
      />
      <div>
        <div class="sb-brand">JM SERVITECA<small>PRODISJM v1.0</small></div>
      </div>
    </div>
    <nav class="sb-nav">
      <div class="sb-sec">Principal</div>
      <a class="sb-link" href="dashboard.html"
      ><span class="sb-ico">📊</span> Dashboard</a
      >
      <a class="sb-link active" href="citas.html"
      ><span class="sb-ico">📅</span> Citas
        <span class="sb-badge">4</span></a
      >
      <a class="sb-link" href="nueva-cita.html"
      ><span class="sb-ico">➕</span> Nueva Cita</a
      >
      <a class="sb-link" href="clientes.html"
      ><span class="sb-ico">👤</span> Clientes</a
      >
      <a class="sb-link" href="vehiculo.html"
      ><span class="sb-ico">🚗</span> Vehículos</a
      >
      <div class="sb-sec" style="margin-top: 8px">Administración</div>
      <a class="sb-link" href="usuarios.html"
      ><span class="sb-ico">👥</span> Usuarios</a
      >
      <a class="sb-link" href="inventario.html"
      ><span class="sb-ico">🔩</span> Inventario
        <span class="sb-badge" style="background: var(--red)">2</span></a
      >
      <a class="sb-link" href="facturacion.html"
      ><span class="sb-ico">💵</span> Facturación</a
      >
      <a class="sb-link" href="reportes.html"
      ><span class="sb-ico">📈</span> Reportes</a
      >
      <div class="sb-sec" style="margin-top: 8px">Portales</div>
      <a class="sb-link" href="portal-cliente.html"><span class="sb-ico">👤</span> Portal Cliente</a>

    </nav>
    <div class="sb-foot">
      <div class="sb-av" id="sbav">JM</div>
      <div>
        <div class="sb-uname" id="sbname">Admin</div>
        <div class="sb-urole" id="sbrole">Administrador</div>
      </div>
      <a href="index.html" class="sb-out" title="Cerrar sesión">⏻</a>
    </div>
  </aside>

  <!-- OVERLAY NAVEGACIÓN MÓVIL -->
  <div id="sb-overlay"></div>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="main">
    <!-- BARRA SUPERIOR -->
    <div class="topbar">
      <button type="button" id="hambtn" class="btn-gh" aria-label="Abrir menú" title="Abrir menú">☰</button>
      <div class="tb-title">Listado de Citas</div>
      <button type="button" class="notif-btn">
        <span class="ndot" aria-hidden="true"></span>
        🔔
      </button>
      <span
              style="font-size: 0.74rem; color: var(--gray1)"
              id="tbdate"
      ></span>
      <div class="av">JM</div>
    </div>

    <!-- CONTENIDO DE LA PÁGINA -->
    <div class="pg">
      <!-- ETIQUETA: Filtros por estado -->
      <div
              style="
              display: flex;
              gap: 8px;
              flex-wrap: wrap;
              margin-bottom: 16px;
              align-items: center;
            "
      >
        <button type="button" class="btn-sm" onclick="filterCitas('all', this)">
          Todos
        </button>
        <button type="button" class="btn-sm-g" onclick="filterCitas('Confirmada', this)">
          Confirmada
        </button>
        <button type="button" class="btn-sm-g" onclick="filterCitas('En proceso', this)">
          En proceso
        </button>
        <button type="button" class="btn-sm-g" onclick="filterCitas('Completada', this)">
          Completada
        </button>
        <button type="button" class="btn-sm-g" onclick="filterCitas('Pendiente', this)">
          Pendiente
        </button>
        <button type="button" class="btn-sm-g" onclick="filterCitas('Cancelada', this)">
          Cancelada
        </button>
        <!-- ETIQUETA: Campo de búsqueda -->
        <input
                class="fc"
                style="
                max-width: 220px;
                margin-left: auto;
                padding: 7px 12px;
                font-size: 0.78rem;
              "
                placeholder="🔍 Buscar cliente, placa..."
                oninput="searchCitas(this.value)"
        />
      </div>

      <!-- ETIQUETA: Tabla principal de citas -->
      <div class="card" style="padding: 0; overflow: hidden">
        <div class="tw">
          <table id="tbl-citas">
            <thead>
            <tr>
              <th>#TKT</th>
              <th>Cliente</th>
              <th>Vehículo</th>
              <th>Servicio</th>
              <th>Técnico</th>
              <th>Fecha</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
            </thead>
            <tbody id="tbody-citas"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="citas.js" defer></script>
</body>
</html>
