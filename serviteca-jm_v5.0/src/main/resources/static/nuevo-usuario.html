<!doctype html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Serviteca JM - Nuevo usuario</title>
<link rel="stylesheet" href="usuarios.css"><link rel="stylesheet" href="nuevo-usuario.css">
<script src="role-guard.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="serviteca-theme.css">
</head><body>
<div class="layout"><div class="main"><div class="topbar">
<a href="usuarios.html" class="back-link">← Usuarios</a><div class="tb-title">Nuevo Usuario</div><span id="tbdate"></span><div class="av">JM</div>
</div><main class="pg"><section class="form-card">
<div class="pg-title">Crear usuario</div><div class="pg-sub">Registra una cuenta para acceder al sistema</div>
<form id="new-user-form" class="user-form">
<label>Nombre completo<input name="nombre" required maxlength="120"></label>
<div class="form-row">
<label>Tipo de documento<select name="tipoDocumento" required>
<option value="CC">Cédula de ciudadanía (CC)</option><option value="CE">Cédula de extranjería (CE)</option>
<option value="NIT">NIT</option><option value="PASAPORTE">Pasaporte</option><option value="TI">Tarjeta de identidad (TI)</option>
</select></label>
<label>Número de documento<input name="numeroDoc" required maxlength="30"></label></div>
<label>Correo electrónico<input name="correo" type="email" required maxlength="100"></label>
<div class="form-row"><label>Teléfono<input name="telefono" maxlength="30"></label><label>Ciudad<input name="ciudad" maxlength="80" value="Tunja - Colombia"></label></div>
<label>Dirección<input name="direccion" maxlength="180"></label>
<div class="password-wrap"><label>Contraseña<input id="password" name="contrasena" type="password" required minlength="8"></label><button type="button" class="eye" data-toggle-password="#password">👁</button></div>
<div class="password-wrap"><label>Confirmar contraseña<input id="confirm-password" type="password" required minlength="8"></label><button type="button" class="eye" data-toggle-password="#confirm-password">👁</button></div>
<div id="password-strength" class="password-strength">Escribe una contraseña.</div>
<label>Rol<select name="rol" required><option value="admin">Administrador</option><option value="tecnico">Técnico</option><option value="cliente" selected>Cliente</option></select></label>
<label>Estado<select name="estado"><option value="ACTIVO" selected>Activo</option><option value="INACTIVO">Inactivo</option></select></label>
<div id="form-message" class="form-message" role="alert"></div>
<div class="form-actions"><a href="usuarios.html" class="btn btn-secondary">Cancelar</a><button class="btn btn-y" type="submit">Crear usuario</button></div>
</form></section></main></div></div>
<script src="password-utils.js"></script><script src="nuevo-usuario.js"></script>
</body></html>
