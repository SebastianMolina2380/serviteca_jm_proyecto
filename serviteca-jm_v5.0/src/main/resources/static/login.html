<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Serviteca JM - Login</title>
  <link
          href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Exo+2:wght@300;400;500;600;700&display=swap"
          rel="stylesheet"
  >
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="serviteca-theme.css">
  <link rel="stylesheet" href="serviteca-premium.css">
  <link rel="stylesheet" href="accesibilidad.css">
</head>
<body>
<!-- PANTALLA P01: Login / Inicio de Sesión -->
<div class="card">
  <!-- COMPONENTE: Logo y encabezado -->
  <div class="card-logo">
    <img
            class="sb-logo"
            src="jm-logo.png"
            alt="JM"
    />
    <h2>PRODISSJM</h2>
    <p>Serviteca JM · Sistema de Gestión de Citas y Servicios</p>
  </div>

  <!-- COMPONENTE: Selector de rol de usuario -->
  <div class="roles" id="roles" role="group" aria-label="Tipo de usuario">
    <button type="button" class="role" aria-pressed="false" onclick="setRole('cliente', this)">
      👤 Cliente
    </button>
    <button type="button" class="role" aria-pressed="false" onclick="setRole('tecnico', this)">
      🔧 Técnico
    </button>
    <button type="button" class="role" aria-pressed="false" onclick="setRole('admin', this)">⚙️ Admin</button>
  </div>

  <form id="loginForm">
    <!-- COMPONENTE: Campo correo electrónico -->
    <div class="fg">
      <label class="fl" for="email">Correo electrónico</label>
      <input
              class="fc"
              type="email"
              id="email"
              name="email"
              placeholder="usuario@servitecajm.com"
              autocomplete="email"
              required
      />
    </div>

    <!-- COMPONENTE: Campo contraseña con botón Ojo -->
    <div class="fg">
      <label class="fl" for="pass">Contraseña</label>
      <div class="password-wrap">
        <input
                class="fc"
                type="password"
                id="pass"
                name="password"
                placeholder="••••••••"
                autocomplete="current-password"
                required
        >
        <button
                type="button"
                class="eye"
                data-toggle-password="#pass"
                aria-label="Mostrar contraseña"
                title="Mostrar contraseña"
        >👁</button>
      </div>
    </div>

    <!-- COMPONENTE: Recordar sesión -->
    <div class="remember">
      <input type="checkbox" id="rem" name="remember">
      <label for="rem">Recordar sesión</label>
    </div>

    <!-- COMPONENTE: Botón ingresar -->
    <button type="submit" class="btn-login btn btn-primary">
      INGRESAR AL SISTEMA →
    </button>
  </form>

  <!-- COMPONENTE: Alerta de error -->
  <div class="error" id="err" role="alert" aria-live="assertive">
    ❌ Ingresa correo y contraseña para continuar.
  </div>

  <!-- COMPONENTE: Links pie -->
  <div class="foot">
    <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
    <a href="index.html">← Volver al sitio</a>
  </div>
</div>

<script src="login.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
