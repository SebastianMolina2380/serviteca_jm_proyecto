
spring.datasource.url=jdbc:postgresql://localhost:5432/DB_PRODISJM
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=none

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR


server.port=8082
spring.application.name=serviteca-jm

# ── FACTURACION ELECTRONICA DIAN · DATOS DEL EMISOR ─────────────
# Vinculados al record DatosFiscalesProperties (prefix
# "serviteca.facturacion"). Los nombres DEBEN coincidir con los
# campos del record o Spring Boot los ignora silenciosamente:
#     .correo                     (NO .email)
#     .responsabilidades-fiscales (NO .responsabilidad-fiscal)
# FacturacionService llama exactamente a emisor.correo() y
# emisor.responsabilidadesFiscales() al emitir la factura.
#
# Cada valor se inyecta como default de variable de entorno: toma
# el dato fiscal por defecto en local y sigue siendo sobrescribible
# en produccion sin editar el archivo.
serviteca.facturacion.emisor.razon-social=${SERVITECA_EMISOR_RAZON_SOCIAL:Serviteca JM S.A.S.}
serviteca.facturacion.emisor.nit=${SERVITECA_EMISOR_NIT:900123456-1}
# Los acentos se escriben como escape \uXXXX (Boyac\u00e1 en lugar
# de Boyacá): Spring Boot decodifica los .properties como
# ISO-8859-1, de modo que un UTF-8 literal llegaria al bean como
# "BoyacÃ¡". El escape \u lo interpreta el cargador de propiedades
# y produce el caracter correcto con independencia de la codificacion.
serviteca.facturacion.emisor.direccion=${SERVITECA_EMISOR_DIRECCION:Carrera Principal, Tunja, Boyac\u00e1}
serviteca.facturacion.emisor.ciudad=${SERVITECA_EMISOR_CIUDAD:Tunja}
serviteca.facturacion.emisor.telefono=${SERVITECA_EMISOR_TELEFONO:3000000000}
serviteca.facturacion.emisor.correo=${SERVITECA_EMISOR_CORREO:facturacion@servitecajm.com}
serviteca.facturacion.emisor.responsabilidades-fiscales=${SERVITECA_RESPONSABILIDADES_FISCALES:Responsable de IVA - O-48}
serviteca.facturacion.software.nombre=${SERVITECA_SOFTWARE_NOMBRE:}
serviteca.facturacion.software.fabricante=${SERVITECA_SOFTWARE_FABRICANTE:}
serviteca.facturacion.software.nit-fabricante=${SERVITECA_SOFTWARE_NIT_FABRICANTE:}
serviteca.facturacion.software.proveedor-tecnologico=${SERVITECA_PROVEEDOR_TECNOLOGICO:}
serviteca.facturacion.software.nit-proveedor-tecnologico=${SERVITECA_NIT_PROVEEDOR_TECNOLOGICO:}
