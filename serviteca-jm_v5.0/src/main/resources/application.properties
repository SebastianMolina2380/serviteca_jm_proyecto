# ============================================================
# SERVITECA JM — CONFIGURACIÓN COMÚN
# ============================================================
# El perfil activo se elige con SERVITECA_PROFILE (dev por defecto):
#     dev  -> application-dev.properties
#     prod -> application-prod.properties
#
# La conexión a base de datos vive en cada perfil, no aquí, para que
# producción exija variables de entorno sin valores inseguros.
# ============================================================
spring.application.name=serviteca-jm
spring.profiles.active=${SERVITECA_PROFILE:dev}
server.port=8082

# ── JPA / HIBERNATE ─────────────────────────────────────────────
# El esquema lo gobierna Flyway; Hibernate nunca lo modifica.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# ── MIGRACIONES AUTOMÁTICAS (FLYWAY) ────────────────────────────
# V1 crea el esquema canónico en una base vacía.
# V2 aplica borrado lógico e integridad, V3 recuperación de contraseña
# y contacto, y V4 alinea las bases heredadas (v5) con el esquema
# canónico. Todos los scripts son idempotentes.
#
# baseline-version=1 (no 0): una base EXISTENTE sin historial de Flyway
# ya contiene las tablas de V1, así que se adopta como versión 1 y solo
# se aplican los deltas (V2, V3, V4). Con 0 se intentaría ejecutar V1
# sobre tablas ya creadas y el arranque fallaba.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# ── SESIÓN Y COOKIES ────────────────────────────────────────────
# HttpOnly + SameSite=Lax + solo cookie (sin ID de sesión en URLs).
# Secure se activa por perfil o con SERVITECA_COOKIE_SECURE=true.
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=SERVITECASESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SERVITECA_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework

# ── ACTUATOR / MONITORIZACIÓN ───────────────────────────────────
# Solo se exponen salud e información. El resto de endpoints de
# Actuator queda fuera de la web y, si se habilitara, exige ADMIN.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
# El correo es opcional: si no hay SMTP configurado, su indicador no debe
# marcar la aplicación como DOWN. Se activa con SERVITECA_MAIL_HEALTH=true.
management.health.mail.enabled=${SERVITECA_MAIL_HEALTH:false}
management.info.env.enabled=true
info.app.name=Serviteca JM
info.app.description=Sistema de gestión para Serviteca JM
info.app.version=1.0.0

# ── OPENAPI / SWAGGER ───────────────────────────────────────────
# La UI se publica en /swagger-ui.html y el contrato en /v3/api-docs.
# En producción se desactiva por defecto (SERVITECA_API_DOCS=false).
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# ── DOCUMENTO DE VENTA · DATOS DEL EMISOR ───────────────────────
# Vinculados al record DatosFiscalesProperties (prefix
# "serviteca.facturacion"). Los nombres DEBEN coincidir con los
# campos del record o Spring Boot los ignora silenciosamente:
#     .correo                     (NO .email)
#     .responsabilidades-fiscales (NO .responsabilidad-fiscal)
serviteca.facturacion.emisor.razon-social=${SERVITECA_EMISOR_RAZON_SOCIAL:Serviteca JM S.A.S.}
serviteca.facturacion.emisor.nit=${SERVITECA_EMISOR_NIT:900123456-1}
# Los acentos se escriben como escape \uXXXX: Spring Boot decodifica
# los .properties como ISO-8859-1 y un UTF-8 literal llegaría roto.
serviteca.facturacion.emisor.direccion=${SERVITECA_EMISOR_DIRECCION:Carrera Principal, Tunja, Boyac\u00e1}
serviteca.facturacion.emisor.ciudad=${SERVITECA_EMISOR_CIUDAD:Tunja}
serviteca.facturacion.emisor.telefono=${SERVITECA_EMISOR_TELEFONO:3000000000}
serviteca.facturacion.emisor.correo=${SERVITECA_EMISOR_CORREO:facturacion@servitecajm.com}
serviteca.facturacion.emisor.responsabilidades-fiscales=${SERVITECA_RESPONSABILIDADES_FISCALES:Responsable de IVA - O-48}
serviteca.facturacion.software.nombre=${SERVITECA_SOFTWARE_NOMBRE:}
serviteca.facturacion.software.fabricante=${SERVITECA_SOFTWARE_FABRICANTE:}
serviteca.facturacion.software.nit-fabricante=${SERVITECA_SOFTWARE_NIT_FABRICANTE:}
serviteca.facturacion.software.proveedor-tecnologico=${SERVITECA_PROVEEDOR_TECNOLOGICO:}
serviteca.facturacion.software.nit-proveedor-tecnologico=${SERVITECA_NIT_PROVEEDOR_TECNOLOGICO:}

# ── CORREO TRANSACCIONAL ────────────────────────────────────────
# Sin SERVITECA_SMTP_HOST el sistema no intenta abrir conexión SMTP:
# registra el enlace de recuperación y los mensajes de contacto en
# el log para que puedan probarse en desarrollo.
spring.mail.host=${SERVITECA_SMTP_HOST:}
spring.mail.port=${SERVITECA_SMTP_PORT:587}
spring.mail.username=${SERVITECA_SMTP_USER:}
spring.mail.password=${SERVITECA_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
serviteca.mail.remitente=${SERVITECA_MAIL_FROM:no-reply@servitecajm.com}
serviteca.mail.contacto=${SERVITECA_CONTACTO_EMAIL:contacto@servitecajm.com}
serviteca.app.url-base=${SERVITECA_APP_URL:http://localhost:8082}
serviteca.password-reset.minutos=${SERVITECA_RESET_MINUTOS:30}
