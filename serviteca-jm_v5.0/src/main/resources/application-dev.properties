# ============================================================
# PERFIL DEV — DESARROLLO LOCAL
# ============================================================
# Arranque:
#     $env:SERVITECA_DB_PASSWORD = "tu_contraseña"
#     .\mvnw.cmd spring-boot:run
#
# La contraseña es obligatoria incluso en dev: no se admiten
# credenciales por defecto en el repositorio.
# ============================================================
spring.datasource.url=${SERVITECA_DB_URL:jdbc:postgresql://localhost:5432/DB_PRODISJM}
spring.datasource.username=${SERVITECA_DB_USER:postgres}
spring.datasource.password=${SERVITECA_DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${SERVITECA_DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Diagnóstico local: activa SQL solo cuando hace falta.
spring.jpa.show-sql=${SERVITECA_SHOW_SQL:false}

# Documentación interactiva disponible en desarrollo.
springdoc.api-docs.enabled=${SERVITECA_API_DOCS:true}
springdoc.swagger-ui.enabled=${SERVITECA_API_DOCS:true}

# Detalle de salud útil para depurar; nunca se usa en producción.
management.endpoint.health.show-details=always

server.servlet.session.cookie.secure=${SERVITECA_COOKIE_SECURE:false}

logging.level.com.serviteca=INFO
