# ============================================================
# PERFIL PROD — DESPLIEGUE
# ============================================================
# Variables obligatorias:
#     SERVITECA_DB_URL
#     SERVITECA_DB_USER
#     SERVITECA_DB_PASSWORD
#
# En una base limpia, InitialAdminBootstrap exige además:
#     INITIAL_ADMIN_NAME, INITIAL_ADMIN_DOCUMENT,
#     INITIAL_ADMIN_EMAIL, INITIAL_ADMIN_PASSWORD
#
# No hay valores por defecto para la conexión: si falta una
# variable, el arranque falla en vez de usar credenciales inseguras.
# ============================================================
spring.datasource.url=${SERVITECA_DB_URL}
spring.datasource.username=${SERVITECA_DB_USER}
spring.datasource.password=${SERVITECA_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${SERVITECA_DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

spring.jpa.show-sql=false

# Swagger desactivado por defecto en producción. Si se habilita,
# queda detrás de la autenticación normal de la aplicación.
springdoc.api-docs.enabled=${SERVITECA_API_DOCS:false}
springdoc.swagger-ui.enabled=${SERVITECA_API_DOCS:false}

# /actuator/health responde UP/DOWN sin exponer detalles internos.
management.endpoint.health.show-details=never

# Cookies solo por HTTPS salvo que se indique lo contrario (por
# ejemplo, en un docker-compose local sin TLS).
server.servlet.session.cookie.secure=${SERVITECA_COOKIE_SECURE:true}

logging.level.com.serviteca=INFO
