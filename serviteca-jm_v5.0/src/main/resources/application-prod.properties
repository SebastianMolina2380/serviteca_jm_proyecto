# ==========================================
# application-prod.properties
# Variables de entorno que Render inyecta:
# PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD
# (Render las genera automáticamente al crear la BD PostgreSQL)
# ==========================================

# --- Servidor ---
server.port=${PORT:8080}

# --- Base de datos ---
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}?sslmode=require&sslrootcert=disable
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Pool de conexiones ---
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Flyway DESHABILITADO (schema importado manualmente) ---
spring.flyway.enabled=false

# --- Seguridad ---
server.servlet.session.cookie.secure=true

# --- Documentación (deshabilitada en producción) ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Actuator ---
management.endpoint.health.show-details=never

# --- Logs ---
logging.level.com.servitecajm=INFO
logging.level.root=WARN