# ============================================================
# PERFIL PROD — DESPLIEGUE
# ============================================================
# Conexión a PostgreSQL (por orden de prioridad):
#
#   A) URL JDBC completa (docker-compose, VPS, base externa):
#         SERVITECA_DB_URL=jdbc:postgresql://host:5432/base?sslmode=require
#
#   B) Datos por separado (render.yaml / secretos del PaaS):
#         SERVITECA_DB_HOST=host-interno
#         SERVITECA_DB_PORT=5432
#         SERVITECA_DB_NAME=base
#
#   C) Variables estándar de Render Postgres:
#         PGHOST, PGPORT, PGDATABASE
#
#   Usuario y contraseña: SERVITECA_DB_USER o PGUSER,
#                         SERVITECA_DB_PASSWORD o PGPASSWORD.
#
# En una base limpia, InitialAdminBootstrap exige además:
#     INITIAL_ADMIN_NAME, INITIAL_ADMIN_DOCUMENT,
#     INITIAL_ADMIN_EMAIL, INITIAL_ADMIN_PASSWORD
#
# No hay valores por defecto para la conexión: si falta todo,
# el arranque falla en vez de usar credenciales inseguras.
# ============================================================
spring.datasource.url=${SERVITECA_DB_URL:jdbc:postgresql://${SERVITECA_DB_HOST:${PGHOST}}:${SERVITECA_DB_PORT:${PGPORT:5432}}/${SERVITECA_DB_NAME:${PGDATABASE}}?sslmode=${SERVITECA_DB_SSLMODE:prefer}}
spring.datasource.username=${SERVITECA_DB_USER:${PGUSER}}
spring.datasource.password=${SERVITECA_DB_PASSWORD:${PGPASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${SERVITECA_DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Swagger desactivado por defecto en producción. SecurityConfig
# permite /v3/api-docs y /swagger-ui sin autenticación: actívalo
# solo de forma temporal con SERVITECA_API_DOCS=true.
springdoc.api-docs.enabled=${SERVITECA_API_DOCS:false}
springdoc.swagger-ui.enabled=${SERVITECA_API_DOCS:false}

# /actuator/health responde UP/DOWN sin exponer detalles internos.
management.endpoint.health.show-details=never

# Cookies solo por HTTPS. En docker-compose local (HTTP) se puede
# poner SERVITECA_COOKIE_SECURE=false.
server.servlet.session.cookie.secure=${SERVITECA_COOKIE_SECURE:true}

logging.level.com.serviteca=INFO
logging.level.org.flywaydb=INFO
