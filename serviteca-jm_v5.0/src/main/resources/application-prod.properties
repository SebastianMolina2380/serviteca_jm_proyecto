# PERFIL PROD — DESPLIEGUE
# ============================================================
spring.datasource.url=${SERVITECA_DB_URL}
spring.datasource.username=${SERVITECA_DB_USER}
spring.datasource.password=${SERVITECA_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.minimum-idle=1


spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Puerto que Render asigna dinámicamente
server.port=${PORT:10000}

# Actuator — health check requerido por Render
management.endpoints.web.exposure.include=health
management.endpoint.health.enabled=true
management.endpoint.health.show-details=never
management.endpoints.web.base-path=/actuator

# Swagger desactivado en producción
springdoc.api-docs.enabled=${SERVITECA_API_DOCS:false}
springdoc.swagger-ui.enabled=${SERVITECA_API_DOCS:false}

# Cookies solo por HTTPS
server.servlet.session.cookie.secure=${SERVITECA_COOKIE_SECURE:true}

logging.level.com.serviteca=INFO