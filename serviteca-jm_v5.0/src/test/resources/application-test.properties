# ============================================================
# PERFIL TEST — PRUEBAS AUTOMATIZADAS
# ============================================================
# Las pruebas de integración se ejecutan contra PostgreSQL real y
# solo cuando SERVITECA_TEST_DB_URL está definida. En CI se usa el
# service container de PostgreSQL; en local, una base temporal.
#
# Ejemplo (PowerShell):
#   $env:SERVITECA_TEST_DB_URL="jdbc:postgresql://localhost:5432/serviteca_test"
#   $env:SERVITECA_TEST_DB_USER="postgres"
#   $env:SERVITECA_TEST_DB_PASSWORD="..."
#   .\mvnw.cmd clean verify
#
# Sin esas variables, `mvn test` ejecuta solo las pruebas unitarias.
# ============================================================
spring.datasource.url=${SERVITECA_TEST_DB_URL:jdbc:postgresql://localhost:5432/serviteca_test}
spring.datasource.username=${SERVITECA_TEST_DB_USER:postgres}
spring.datasource.password=${SERVITECA_TEST_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway crea/actualiza el esquema de la base de pruebas.
spring.flyway.enabled=true

# Documentación y salud visibles para comprobar su configuración.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
management.endpoint.health.show-details=always

# Sin SMTP: EmailService registra los correos en el log.
spring.mail.host=

logging.level.com.serviteca=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
